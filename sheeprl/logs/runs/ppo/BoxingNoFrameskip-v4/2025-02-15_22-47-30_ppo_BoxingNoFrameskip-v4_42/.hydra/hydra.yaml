hydra:
  run:
    dir: logs/runs/${root_dir}/${run_name}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - exp=ppo
    - env=atari
    - env.id=BoxingNoFrameskip-v4
    - algo.cnn_keys.encoder=[rgb]
    - checkpoint.every=100000
    - checkpoint.keep_last=null
    - fabric.accelerator=gpu
    - fabric.strategy=ddp
    - fabric.devices=1
    - algo.mlp_keys.encoder=[]
    - algo.total_steps=10000000
  job:
    name: cli
    chdir: false
    override_dirname: algo.cnn_keys.encoder=[rgb],algo.mlp_keys.encoder=[],algo.total_steps=10000000,checkpoint.every=100000,checkpoint.keep_last=null,env.id=BoxingNoFrameskip-v4,env=atari,exp=ppo,fabric.accelerator=gpu,fabric.devices=1,fabric.strategy=ddp
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.0
    version_base: '1.3'
    cwd: /deac/csc/alqahtaniGrp/shefrs24/AdversaryLoss-Container/AdversaryLoss/sheeprl
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: sheeprl.configs
      schema: pkg
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /deac/csc/alqahtaniGrp/shefrs24/AdversaryLoss-Container/AdversaryLoss/sheeprl/logs/runs/ppo/BoxingNoFrameskip-v4/2025-02-15_22-47-30_ppo_BoxingNoFrameskip-v4_42
    choices:
      exp: ppo
      hydra: default.yaml
      model_manager: ppo
      metric: default.yaml
      logger@metric.logger: tensorboard
      fabric: default.yaml
      env: atari
      distribution: default.yaml
      checkpoint: default.yaml
      buffer: default.yaml
      algo: ppo
      optim@algo.optimizer: adam
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
