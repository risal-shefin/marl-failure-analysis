num_threads: 1
float32_matmul_precision: high
dry_run: false
seed: 42
torch_use_deterministic_algorithms: false
torch_backends_cudnn_benchmark: true
torch_backends_cudnn_deterministic: false
cublas_workspace_config: null
exp_name: ppo_BoxingNoFrameskip-v4
run_name: 2025-02-15_22-47-30_ppo_BoxingNoFrameskip-v4_42
root_dir: ppo/BoxingNoFrameskip-v4
algo:
  name: ppo
  total_steps: 10000000
  per_rank_batch_size: 64
  run_test: true
  cnn_keys:
    encoder:
    - rgb
  mlp_keys:
    encoder: []
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
    eps: 0.0001
    weight_decay: 0
    betas:
    - 0.9
    - 0.999
  anneal_lr: false
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 10
  loss_reduction: mean
  normalize_advantages: false
  clip_coef: 0.2
  anneal_clip_coef: false
  clip_vloss: false
  ent_coef: 0.0
  anneal_ent_coef: false
  vf_coef: 1.0
  rollout_steps: 128
  dense_units: 64
  mlp_layers: 2
  dense_act: torch.nn.Tanh
  layer_norm: false
  max_grad_norm: 0.0
  encoder:
    cnn_features_dim: 512
    mlp_features_dim: 64
    dense_units: 64
    mlp_layers: 2
    dense_act: torch.nn.Tanh
    layer_norm: false
    ortho_init: false
  actor:
    dense_units: 64
    mlp_layers: 2
    dense_act: torch.nn.Tanh
    layer_norm: false
    ortho_init: false
  critic:
    dense_units: 64
    mlp_layers: 2
    dense_act: torch.nn.Tanh
    layer_norm: false
    ortho_init: false
buffer:
  size: 128
  memmap: true
  validate_args: false
  from_numpy: false
  checkpoint: true
  share_data: false
checkpoint:
  every: 100000
  resume_from: null
  save_last: true
  keep_last: null
distribution:
  validate_args: false
  type: auto
env:
  id: BoxingNoFrameskip-v4
  num_envs: 4
  frame_stack: 1
  sync_env: false
  screen_size: 64
  action_repeat: 4
  grayscale: false
  clip_rewards: false
  capture_video: true
  frame_stack_dilation: 1
  actions_as_observation:
    num_stack: -1
    noop: You MUST define the NOOP
    dilation: 1
  max_episode_steps: 27000
  reward_as_observation: false
  wrapper:
    _target_: gymnasium.wrappers.AtariPreprocessing
    env:
      _target_: gymnasium.make
      id: BoxingNoFrameskip-v4
      render_mode: rgb_array
    noop_max: 30
    terminal_on_life_loss: false
    frame_skip: 4
    screen_size: 64
    grayscale_obs: false
    scale_obs: false
    grayscale_newaxis: true
fabric:
  _target_: lightning.fabric.Fabric
  devices: 1
  num_nodes: 1
  strategy: ddp
  accelerator: gpu
  precision: 32-true
  callbacks:
  - _target_: sheeprl.utils.callback.CheckpointCallback
    keep_last: null
metric:
  log_every: 5000
  disable_timer: false
  log_level: 1
  sync_on_compute: false
  aggregator:
    _target_: sheeprl.utils.metric.MetricAggregator
    raise_on_missing: false
    metrics:
      Rewards/rew_avg:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: false
      Game/ep_len_avg:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: false
      Loss/value_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: false
      Loss/policy_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: false
      Loss/entropy_loss:
        _target_: torchmetrics.MeanMetric
        sync_on_compute: false
  logger:
    _target_: lightning.fabric.loggers.TensorBoardLogger
    name: 2025-02-15_22-47-30_ppo_BoxingNoFrameskip-v4_42
    root_dir: logs/runs/ppo/BoxingNoFrameskip-v4
    version: null
    default_hp_metric: true
    prefix: ''
    sub_dir: null
model_manager:
  disabled: true
  models:
    agent:
      model_name: ppo_BoxingNoFrameskip-v4_agent
      description: PPO Agent in BoxingNoFrameskip-v4 Environment
      tags: {}
